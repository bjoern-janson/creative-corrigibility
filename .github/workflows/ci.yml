name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Emit freeze candidate hashes
        env:
          PYTHONPATH: src
        run: python -m creative_corrigibility.custody --emit-hashes
      - name: Run apparatus tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Verify frozen apparatus custody
        env:
          PYTHONPATH: src
        run: python -m creative_corrigibility.custody --verify
